
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Pelanggan - ASKARA ZAYYAN</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:20px;color:#172033}
main{max-width:800px;margin:auto;background:white;padding:22px;border-radius:14px}
h1{color:#075985}input,button{box-sizing:border-box;padding:12px;margin:5px 0;width:100%;border-radius:8px;border:1px solid #cbd5e1}
button{background:#075985;color:white;cursor:pointer;border:0}
a{color:#075985}table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{padding:10px}
</style>
</head>
<body>
<main>
<h1>ASKARA ZAYYAN</h1>
<h2>Data Pelanggan</h2>
<form id="form">
<input id="nama" placeholder="Nama pengurus" required>
<input id="namaStnk" placeholder="Nama sesuai STNK" required>
<input id="hp" placeholder="Nomor HP">
<button type="submit">Simpan Pelanggan</button>
</form>
<div class="actions">
<a href="kendaraan.html">Data Kendaraan</a>
<a href="transaksi.html">Transaksi</a>
<a href="dashboard.html">Dashboard</a>
</div>
<table>
<thead><tr><th>Nama Pengurus / STNK</th><th>HP</th><th>Aksi</th></tr></thead>
<tbody id="daftar"></tbody>
</table>
</main>
<script>
const KEY="dataPelanggan";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const form=document.getElementById("form");
function simpan(){localStorage.setItem(KEY,JSON.stringify(data));tampil()}
function tampil(){
daftar.innerHTML="";
data.forEach((p,i)=>{
const tr=document.createElement("tr");
[p.nama+" / "+p.namaStnk,p.hp||"-"].forEach(v=>{
const td=document.createElement("td");td.textContent=v;tr.appendChild(td)
});
const td=document.createElement("td");
const btn=document.createElement("button");btn.textContent="Hapus";
btn.onclick=()=>{if(confirm("Hapus pelanggan ini?")){data.splice(i,1);simpan()}};
td.appendChild(btn);tr.appendChild(td);daftar.appendChild(tr)
})
}
form.onsubmit=e=>{
e.preventDefault();
data.push({
id:crypto.randomUUID(),
nama:nama.value.trim(),
namaStnk:namaStnk.value.trim(),
hp:hp.value.trim()
});
simpan();form.reset();alert("Pelanggan tersimpan")
};
tampil();
</script>
</body>
</html>
