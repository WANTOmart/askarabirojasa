
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaksi - ASKARA ZAYYAN</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:20px;color:#172033}
main{max-width:950px;margin:auto;background:white;padding:22px;border-radius:14px}
h1{color:#075985}label{display:block;font-weight:bold;margin-top:10px}
input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border:1px solid #cbd5e1;border-radius:8px}
button{background:#075985;color:white;border:0;cursor:pointer}
a{color:#075985}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.result{background:#e0f2fe;padding:15px;border-radius:10px;margin-top:15px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
@media print{form,.noprint,a,.noprint-area{display:none!important}body{background:white}main{max-width:none}}
</style>
</head>
<body>
<main>
<h1>ASKARA ZAYYAN</h1>
<h2>Kalkulator dan Transaksi Biro Jasa</h2>
<p><a href="pelanggan.html">Pelanggan</a> | <a href="kendaraan.html">Kendaraan</a> | <a href="dashboard.html">Dashboard</a></p>

<form id="form">
<div class="grid">
<div>
<label>Jenis layanan</label>
<select id="layanan" required>
<option>STNK Tahunan</option>
<option>STNK 5 Tahunan / Ganti Plat</option>
<option>Balik Nama</option>
<option>Mutasi Masuk</option>
<option>Cabut Berkas / Mutasi Keluar</option>
<option>STNK Hilang</option>
<option>BPKB Hilang</option>
<option>Ganti Alamat</option>
<option>Ganti Warna</option>
<option>Ganti Bentuk</option>
<option>Ganti Nopol / Nopil</option>
<option>Blokir STNK</option>
</select>
</div>
<div>
<label>Pilih pelanggan</label>
<select id="pilihPelanggan" required><option value="">-- Pilih pelanggan --</option></select>
</div>
<div>
<label>Pilih kendaraan</label>
<select id="pilihKendaraan" required><option value="">-- Pilih kendaraan --</option></select>
</div>
<div>
<label>Nama pengurus</label><input id="nama" readonly>
</div>
<div>
<label>Nama sesuai STNK</label><input id="namaStnk" readonly>
</div>
<div>
<label>Nomor polisi</label><input id="nopol" readonly>
</div>
<div>
<label>Merek kendaraan</label><input id="merk" readonly>
</div>
<div>
<label>Asal mutasi (jika ada)</label><input id="asal" placeholder="Contoh: Banyuwangi">
</div>
<div>
<label>Tujuan mutasi (jika ada)</label><input id="tujuan" placeholder="Contoh: Bondowoso">
</div>
</div>

<h3>Rincian biaya</h3>
<div class="grid">
<div><label>PKB (Rp)</label><input id="pkb" type="number" min="0" value="0"></div>
<div><label>Opsen PKB (Rp)</label><input id="opsenPkb" type="number" min="0" value="0"></div>
<div><label>SWDKLLJ (Rp)</label><input id="swdkllj" type="number" min="0" value="0"></div>
<div><label>Denda PKB (Rp)</label><input id="dendaPkb" type="number" min="0" value="0"></div>
<div><label>Denda SWDKLLJ (Rp)</label><input id="dendaSwdkllj" type="number" min="0" value="0"></div>
<div><label>BBNKB (Rp)</label><input id="bbnkb" type="number" min="0" value="0"></div>
<div><label>Opsen BBNKB (Rp)</label><input id="opsenBbnkb" type="number" min="0" value="0"></div>
<div><label>PNBP (Rp)</label><input id="pnbp" type="number" min="0" value="0"></div>
<div><label>Biaya resmi lainnya (Rp)</label><input id="lainResmi" type="number" min="0" value="0"></div>
<div><label>Jasa biro (Rp)</label><input id="jasa" type="number" min="0" value="0"></div>
<div><label>Uang muka / DP (Rp)</label><input id="dp" type="number" min="0" value="0"></div>
</div>
<label>Catatan</label><textarea id="catatan" rows="2" placeholder="Catatan tambahan"></textarea>
<button type="button" onclick="hitung()">Hitung Total</button>
<button type="submit">Simpan Transaksi</button>
</form>

<div class="result" id="hasil">Total tagihan: Rp0</div>

<div class="noprint">
<h3>Riwayat Transaksi</h3>
<input id="cari" placeholder="Cari nama atau nomor polisi" oninput="tampil()">
<button type="button" onclick="window.print()">Cetak halaman</button>
<button type="button" onclick="ekspor()">Ekspor CSV</button>
</div>
<table>
<thead><tr><th>Tanggal</th><th>Layanan</th><th>Pelanggan</th><th>Nopol</th><th>Biaya resmi</th><th>Jasa</th><th>DP</th><th>Sisa</th><th>Status</th><th class="noprint">Aksi</th></tr></thead>
<tbody id="daftar"></tbody>
</table>
</main>

<script>
const ambil=k=>JSON.parse(localStorage.getItem(k)||"[]");
let pelangganData=[],kendaraanData=[],transaksi=ambil("azTransaksi");
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
const nilai=id=>Math.max(0,Number(document.getElementById(id).value)||0);
const idsBiaya=["pkb","opsenPkb","swdkllj","dendaPkb","dendaSwdkllj","bbnkb","opsenBbnkb","pnbp","lainResmi"];
function refreshData(){
pelangganData=ambil("dataPelanggan");kendaraanData=ambil("dataKendaraan");
pilihPelanggan.innerHTML='<option value="">-- Pilih pelanggan --</option>';
pelangganData.forEach((p,i)=>{
const o=document.createElement("option");o.value=String(i);o.textContent=p.nama+" - "+p.namaStnk;pilihPelanggan.appendChild(o)
});
isiKendaraan()
}
function isiKendaraan(){
pilihKendaraan.innerHTML='<option value="">-- Pilih kendaraan --</option>';
const p=pelangganData[Number(pilihPelanggan.value)];
if(!p)return;
kendaraanData.forEach((k,i)=>{
if(k.namaStnk===p.namaStnk && k.pengurus===p.nama){
const o=document.createElement("option");o.value=String(i);o.textContent=k.nopol+" - "+(k.merk||"Kendaraan");pilihKendaraan.appendChild(o)
}
})
}
pilihPelanggan.onchange=()=>{
const p=pelangganData[Number(pilihPelanggan.value)];
nama.value=p?.nama||"";namaStnk.value=p?.namaStnk||"";
nopol.value="";merk.value="";isiKendaraan()
};
pilihKendaraan.onchange=()=>{
const k=kendaraanData[Number(pilihKendaraan.value)];
if(k){nopol.value=k.nopol;merk.value=k.merk||""}
};
function totalResmi(){return idsBiaya.reduce((s,id)=>s+nilai(id),0)}
function hitung(){
const resmi=totalResmi(),j=nilai("jasa"),d=nilai("dp"),total=resmi+j;
hasil.innerHTML="<b>Biaya resmi:</b> "+rupiah(resmi)+"<br><b>Jasa biro:</b> "+rupiah(j)+"<br><b>Total tagihan:</b> "+rupiah(total)+"<br><b>DP:</b> "+rupiah(d)+"<br><b>Sisa pembayaran:</b> "+rupiah(Math.max(0,total-d));
return {resmi,j,d,total,sisa:Math.max(0,total-d)}
}
form.onsubmit=e=>{
e.preventDefault();
if(!nama.value||!nopol.value)return alert("Pilih pelanggan dan kendaraannya terlebih dahulu.");
const t=hitung();
transaksi.unshift({
id:crypto.randomUUID(),tanggal:new Date().toLocaleString("id-ID"),
layanan:layanan.value,nama:nama.value,namaStnk:namaStnk.value,
nopol:nopol.value,merk:merk.value,asal:asal.value,tujuan:tujuan.value,
biayaResmi:t.resmi,jasa:t.j,dp:t.d,total:t.total,sisa:t.sisa,
catatan:catatan.value,status:"PROSES"
});
localStorage.setItem("azTransaksi",JSON.stringify(transaksi));
tampil();alert("Transaksi berhasil disimpan.")
};
function tampil(){
daftar.innerHTML="";
const q=(cari.value||"").toLowerCase();
transaksi.forEach((t,i)=>{
if(!((t.nama||"")+" "+(t.nopol||"")).toLowerCase().includes(q))return;
const tr=document.createElement("tr");
const vals=[t.tanggal,t.layanan,t.nama,t.nopol,rupiah(t.biayaResmi),rupiah(t.jasa),rupiah(t.dp),rupiah(t.sisa),t.status];
vals.forEach(v=>{const td=document.createElement("td");td.textContent=v??"";tr.appendChild(td)});
const td=document.createElement("td");td.className="noprint";
const cetak=document.createElement("button");cetak.textContent="Cetak";
cetak.onclick=()=>cetakTransaksi(t);
const status=document.createElement("button");status.textContent=t.status==="SELESAI"?"Jadikan Proses":"Tandai Selesai";
status.onclick=()=>{transaksi[i].status=t.status==="SELESAI"?"PROSES":"SELESAI";simpanTransaksi()};
const hapus=document.createElement("button");hapus.textContent="Hapus";
hapus.onclick=()=>{if(confirm("Hapus transaksi ini?")){transaksi.splice(i,1);simpanTransaksi()}};
td.append(cetak,status, hapus);tr.appendChild(td);daftar.appendChild(tr)
})
}
function simpanTransaksi(){localStorage.setItem("azTransaksi",JSON.stringify(transaksi));tampil()}
function cetakTransaksi(t){
const w=window.open("","_blank");
if(!w)return alert("Izinkan pop-up untuk mencetak bukti transaksi.");
w.document.write(`<html><head><title>Bukti Transaksi</title><style>body{font-family:Arial;padding:25px}h2{color:#075985}</style></head><body><h2>ASKARA ZAYYAN</h2><h3>Bukti Transaksi Biro Jasa</h3><p>Tanggal: ${aman(t.tanggal)}</p><p>Layanan: ${aman(t.layanan)}</p><p>Nama: ${aman(t.nama)}</p><p>Nama STNK: ${aman(t.namaStnk)}</p><p>Nopol: ${aman(t.nopol)}</p><p>Kendaraan: ${aman(t.merk)}</p><hr><p>Biaya resmi: ${rupiah(t.biayaResmi)}</p><p>Jasa biro: ${rupiah(t.jasa)}</p><h3>Total: ${rupiah(t.total)}</h3><p>DP: ${rupiah(t.dp)}</p><h3>Sisa: ${rupiah(t.sisa)}</h3><p>Status: ${aman(t.status)}</p><p>Catatan: ${aman(t.catatan||"-")}</p><script>window.onload=()=>window.print()<\/script></body></html>`);
w.document.close()
}
function aman(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ekspor(){
const rows=[["Tanggal","Layanan","Nama","Nopol","Biaya Resmi","Jasa","Total","DP","Sisa","Status"],...transaksi.map(t=>[t.tanggal,t.layanan,t.nama,t.nopol,t.biayaResmi,t.jasa,t.total,t.dp,t.sisa,t.status])];
const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}));a.download="transaksi-askara-zayyan.csv";a.click();URL.revokeObjectURL(a.href)
}
idsBiaya.concat(["jasa","dp"]).forEach(id=>document.getElementById(id).addEventListener("input",hitung));
refreshData();tampil();hitung();
</script>
</body>
</html>
